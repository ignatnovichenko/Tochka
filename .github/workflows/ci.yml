name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package with spreadsheet support
        run: python -m pip install -e '.[spreadsheet]'
      - name: Check installer syntax without installing
        run: |
          bash -n install.sh
          sh -n install.sh
      - name: Run tests and deterministic controls
        run: python scripts/check_all.py
      - name: Smoke test installed CLI
        run: |
          tochka --help
          tochka keys --help
      - name: Install pinned uv for standalone installer check
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://astral.sh/uv/0.13.4/install.sh -o "$RUNNER_TEMP/uv-install.sh"
          UV_INSTALL_DIR="$RUNNER_TEMP/tochka-uv" UV_NO_MODIFY_PATH=1 sh "$RUNNER_TEMP/uv-install.sh"
          echo "$RUNNER_TEMP/tochka-uv" >> "$GITHUB_PATH"
      - name: Install into isolated tool environment and check bundled demo
        shell: bash
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/tochka-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/tochka-bin"
          TOCHKA_INSTALL_SOURCE="$GITHUB_WORKSPACE" sh install.sh --no-modify-path
          "$UV_TOOL_BIN_DIR/tochka" --help
          "$UV_TOOL_BIN_DIR/tochka" init "$RUNNER_TEMP/tochka-demo" --demo
          test -s "$RUNNER_TEMP/tochka-demo/cases.jsonl"
          uv tool uninstall nir-eval
