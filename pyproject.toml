[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nir-eval"
version = "0.5.1"
description = "Reproducible public business-task LLM evaluation MVP"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spreadsheet = ["openpyxl==3.1.5"]
local-model = ["torch==2.6.0", "transformers==4.48.3"]

[project.scripts]
nir-eval = "nir_eval.cli:main"
tochka = "nir_eval.app:main"

[tool.setuptools.packages.find]
include = ["nir_eval*"]
namespaces = false

[tool.setuptools.package-data]
nir_eval = ["demo/*.jsonl", "promptfoo_runtime/package.json", "promptfoo_runtime/package-lock.json", "promptfoo_runtime/worker.mjs"]
